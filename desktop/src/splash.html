<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f0f14;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100vh; overflow: hidden;
      -webkit-app-region: drag;
    }
    .logo {
      width: 64px; height: 64px; border-radius: 16px;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 32px rgba(139, 92, 246, 0.3);
      margin-bottom: 20px;
    }
    .logo span {
      color: white; font-size: 28px; font-weight: 700;
    }
    .name {
      color: #e2e8f0; font-size: 16px; font-weight: 600;
      margin-bottom: 6px; letter-spacing: 0.5px;
    }
    .sub {
      color: #64748b; font-size: 11px; margin-bottom: 24px;
    }
    .spinner {
      width: 24px; height: 24px; border: 2.5px solid rgba(139, 92, 246, 0.15);
      border-top-color: #8b5cf6; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="logo"><img src="../assets/icon.png" alt="CholoShikhi" style="width:48px;height:48px;object-fit:contain;" /></div>
  <div class="name">CholoShikhi</div>
  <div class="sub">Siblings Team</div>
  <div class="spinner"></div>
</body>
</html>
